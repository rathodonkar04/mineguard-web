; MineGuard ESP32 PlatformIO Configuration
; Smart India Hackathon 2026 (Problem Statement 26025)

[platformio]
default_envs = node_sensor
src_dir = .

[env]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

[env:node_sensor]
build_src_filter = +<node_sensor/*>
build_flags = 
    ${env.build_flags}
    -D MINEGUARD_NODE_ID=\"NODE_01\"

[env:gateway_bridge]
build_src_filter = +<gateway_bridge/*>
build_flags = 
    ${env.build_flags}
    -D GATEWAY_BUILD
