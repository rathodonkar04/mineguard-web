<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242B26" />
      <stop offset="100%" stop-color="#181D1A" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F5D53" />
      <stop offset="100%" stop-color="#343E37" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F7655" />
      <stop offset="50%" stop-color="#A87925" />
      <stop offset="100%" stop-color="#A84444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Engineering Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Banner Accent Line -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)" />

  <!-- Shield Emblem -->
  <g transform="translate(100, 140)">
    <polygon points="60,0 120,20 120,80 60,120 0,80 0,20" fill="url(#shield)" stroke="#687A6E" stroke-width="3" />
    <!-- Check / Inclinometer Vector -->
    <path d="M35 60 L52 78 L88 38" fill="none" stroke="#68D391" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Title & Badges -->
  <text x="260" y="195" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="4">MINEGUARD</text>
  <rect x="650" y="155" width="160" height="34" rx="4" fill="#3F4A42" stroke="#687A6E" stroke-width="1.5" />
  <text x="730" y="178" fill="#E2E8F0" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">SIH 2026 PS 26025</text>

  <!-- Subtitle -->
  <text x="260" y="245" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500">
    Autonomous Real-Time Geotechnical Mine Subsidence Monitoring System
  </text>

  <!-- Industrial Card Visuals -->
  <g transform="translate(100, 310)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="230" rx="8" fill="#1F2421" stroke="#38433B" stroke-width="2" />
    <text x="24" y="42" fill="#718096" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">ARRAY TOPOLOGY</text>
    <text x="24" y="85" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold">4 Wireless Nodes</text>
    <text x="24" y="125" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">ESP-NOW 2.4 GHz Mesh</text>
    <text x="24" y="150" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Multi-Hop Self-Healing</text>
    <rect x="24" y="180" width="90" height="24" rx="3" fill="#3F7655" />
    <text x="69" y="196" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">LIVE MESH</text>

    <!-- Card 2 -->
    <rect x="345" y="0" width="310" height="230" rx="8" fill="#1F2421" stroke="#38433B" stroke-width="2" />
    <text x="369" y="42" fill="#718096" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">GEOTECHNICAL METRIC</text>
    <text x="369" y="85" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold">Continuous Incline</text>
    <text x="369" y="125" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Tilt X/Y &amp; Displacement</text>
    <text x="369" y="150" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Sub-millimeter Precision</text>
    <rect x="369" y="180" width="130" height="24" rx="3" fill="#A87925" />
    <text x="434" y="196" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DGMS STANDARDS</text>

    <!-- Card 3 -->
    <rect x="690" y="0" width="310" height="230" rx="8" fill="#1F2421" stroke="#38433B" stroke-width="2" />
    <text x="714" y="42" fill="#718096" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">PREDICTIVE AI</text>
    <text x="714" y="85" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold">Hazard Forecasting</text>
    <text x="714" y="125" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">16-Feature Statistical Engine</text>
    <text x="714" y="150" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Early Impending Caving Alert</text>
    <rect x="714" y="180" width="105" height="24" rx="3" fill="#3F4A42" />
    <text x="766" y="196" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SCADA READY</text>
  </g>

  <!-- Footer Authority Notice -->
  <text x="100" y="590" fill="#687A6E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
    Ministry of Coal, Government of India • Moonidih Colliery Panel P-4 Deployment • Domain: mineguard-monitoring.gov.in
  </text>
</svg>
